{{- if and .Values.ingress.enabled .Values.domain }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ms.name" . }}
  labels:
    {{- include "ms.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ include "ms.host" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ms.name" . }}
                port:
                  name: http
{{- end }}
