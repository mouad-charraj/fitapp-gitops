# Each environment gets a fixed share of the cluster, so dev/test can never starve prod.
# LimitRange gives default requests/limits to any container that forgets to set them.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: env-quota
  namespace: dev
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.memory: 3Gi
    pods: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: env-quota
  namespace: test
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.memory: 3Gi
    pods: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: env-quota
  namespace: prod
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.memory: 6Gi
    pods: "40"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: dev
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { memory: 256Mi }
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: test
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { memory: 256Mi }
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: prod
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { memory: 256Mi }
