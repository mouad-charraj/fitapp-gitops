# The 3 environments. Pod Security "restricted": pods must run as non-root,
# without privilege escalation, with all Linux capabilities dropped.
apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    env: dev
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: test
  labels:
    env: test
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    env: prod
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
